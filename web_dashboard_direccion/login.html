<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Seguro | Codiagro Dirección General 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-emerald: #10b981;
      --accent-emerald-hover: #059669;
      --accent-gold: #f59e0b;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 15% 15%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
        radial-gradient(at 85% 85%, rgba(245, 158, 11, 0.08) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(30, 41, 59, 0.5) 0px, transparent 80%);
      color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      perspective: 1000px;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      padding: 2.5rem 2.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: cardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-logo {
      height: 48px;
      margin-bottom: 1.25rem;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .brand-badge {
      display: inline-block;
      margin-top: 0.35rem;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-emerald);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
    }

    .brand-subtext {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 0.6rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.45rem;
      letter-spacing: 0.01em;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      font-size: 1rem;
      color: #64748b;
      pointer-events: none;
      user-select: none;
    }

    .form-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 0.75rem;
      padding: 0.8rem 1rem 0.8rem 2.75rem;
      color: #ffffff;
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent-emerald);
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .form-input::placeholder {
      color: #475569;
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 0.75rem;
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .toggle-pwd-btn:hover {
      color: #94a3b8;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      cursor: pointer;
      user-select: none;
    }

    .remember-me input {
      accent-color: var(--accent-emerald);
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      border-radius: 0.75rem;
      padding: 0.85rem 1.5rem;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.35);
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
      transform: translateY(-1px);
      box-shadow: 0 14px 20px -3px rgba(16, 185, 129, 0.45);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 0.75rem 1rem;
      border-radius: 0.65rem;
      font-size: 0.82rem;
      margin-bottom: 1.25rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .credentials-hint {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.75rem;
      color: #64748b;
      line-height: 1.4;
      text-align: center;
    }

    .credentials-hint code {
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <img src="codiagro_logo.png" alt="Codiagro Logo" class="brand-logo" onerror="this.style.display='none'">
        <h1 class="brand-title">
          <span>CODIAGRO</span>
        </h1>
        <div class="brand-badge">Dirección General & Finanzas</div>
        <p class="brand-subtext">Plataforma Analítica y Presupuesto 2026</p>
      </div>

      <div class="alert-error" id="errorAlert">
        <span>⚠️</span>
        <span id="errorMessage">Usuario o contraseña incorrectos.</span>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">Usuario</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="username" class="form-input" placeholder="Usuario (ej. oscar.ocampo)" required autofocus autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" class="form-input" placeholder="Contraseña de acceso" required autocomplete="current-password">
            <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility()" title="Mostrar/Ocultar contraseña" id="togglePwdBtn">👁️</button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" checked>
            <span>Recordar sesión en este equipo</span>
          </label>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span>Acceder a la Plataforma</span>
          <span>➜</span>
        </button>
      </form>

      <div class="credentials-hint">
        🔒 Acceso restringido exclusivo para Dirección General.<br>
        Usuario: <code>oscar.ocampo</code> &bull; Contraseña: <code>Codiagro2026!</code>
      </div>
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const btn = document.getElementById('togglePwdBtn');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        btn.textContent = '🙈';
      } else {
        pwd.type = 'password';
        btn.textContent = '👁️';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const remember = document.getElementById('rememberMe').checked;
      const errorAlert = document.getElementById('errorAlert');
      const errorMsg = document.getElementById('errorMessage');
      const submitBtn = document.getElementById('submitBtn');

      errorAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Verificando...</span>';

      try {
        // Enviar al backend local si está disponible
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          const authData = {
            user: data.user || user,
            token: data.token,
            timestamp: Date.now()
          };
          sessionStorage.setItem('codiagro_auth', JSON.stringify(authData));
          if (remember) {
            localStorage.setItem('codiagro_auth', JSON.stringify(authData));
          }
          window.location.href = '/index.html';
          return;
        } else {
          showError(data.error || 'Usuario o contraseña incorrectos.');
        }
      } catch (err) {
        // Fallback para ejecución estática sin backend
        const validUsers = ['oscar.ocampo', 'oscar', 'direccion', 'admin'];
        const validPass = 'Codiagro2026!';
        if (validUsers.includes(user.toLowerCase()) && pass === validPass) {
          const authData = {
            user: user,
            token: 'local_static_token',
            timestamp: Date.now()
          };
          sessionStorage.setItem('codiagro_auth', JSON.stringify(authData));
          if (remember) {
            localStorage.setItem('codiagro_auth', JSON.stringify(authData));
          }
          window.location.href = '/index.html';
          return;
        } else {
          showError('Usuario o contraseña incorrectos.');
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Acceder a la Plataforma</span><span>➜</span>';
      }
    }

    function showError(msg) {
      const errorAlert = document.getElementById('errorAlert');
      const errorMsg = document.getElementById('errorMessage');
      errorMsg.textContent = msg;
      errorAlert.style.display = 'flex';
      // Re-trigger animation
      errorAlert.style.animation = 'none';
      void errorAlert.offsetWidth;
      errorAlert.style.animation = 'shake 0.35s ease';
    }

    // Auto-check si ya hay sesión válida
    (function checkExistingSession() {
      const session = sessionStorage.getItem('codiagro_auth') || localStorage.getItem('codiagro_auth');
      if (session) {
        try {
          const parsed = JSON.parse(session);
          if (parsed && parsed.user) {
            // Validar con servidor
            fetch('/api/auth/status')
              .then(r => r.json())
              .then(d => {
                if (d.authenticated) {
                  window.location.href = '/index.html';
                }
              })
              .catch(() => {
                window.location.href = '/index.html';
              });
          }
        } catch (e) {}
      }
    })();
  </script>
</body>
</html>
